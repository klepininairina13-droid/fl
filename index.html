<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BrainFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; font-family: 'Inter', sans-serif; background: #0a0a0f; position: fixed; }

.catalog-slider { display: flex; width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.catalog-slider::-webkit-scrollbar { display: none; }
.catalog-slide { min-width: 100vw; width: 100vw; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 30px; scroll-snap-align: start; scroll-snap-stop: always; }
.catalog-slide:nth-child(1) { background: linear-gradient(135deg, #0a0a0f, #1a1a2e); justify-content: flex-start; padding-top: 12vh; }
.catalog-slide:nth-child(2) { background: linear-gradient(135deg, #1a0a0f, #3e1a2e); }

.start-mechanic-btn { position: relative; border: none; padding: 24px 50px; border-radius: 50px; font-size: 20px; font-weight: 600; font-family: inherit; cursor: pointer; min-width: 280px; transition: all 0.3s ease; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.3); border-left: 1px solid rgba(255,255,255,0.15); border-right: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.02); box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2); color: rgba(255,255,255,0.9); }
.start-mechanic-btn::before { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%); border-radius: 50px 50px 40px 40px; pointer-events: none; }
.start-mechanic-btn:active { transform: translateY(2px) scale(0.98); }

.catalog-dots { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 50; background: rgba(255,255,255,0.08); backdrop-filter: blur(15px); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
.catalog-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: all 0.3s; }
.catalog-dot.active { background: rgba(255,255,255,0.8); width: 20px; border-radius: 3px; }

.trainer-overlay { position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column; height: 100dvh; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); }
.trainer-overlay.active { display: flex; }
.trainer-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; padding-top: calc(15px + env(safe-area-inset-top, 15px)); flex-shrink: 0; z-index: 10; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); cursor: pointer; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
.session-info { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
.trainer-content { flex: 1; display: flex; flex-direction: column; padding: 0 20px 10px; overflow: hidden; position: relative; }
.game-zone { flex: 1; position: relative; border-radius: 24px; overflow: hidden; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 2px 20px rgba(0,0,0,0.3); }
.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 10px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 20px; margin-top: 12px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
.stat-item { text-align: center; }
.stat-value { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); margin-bottom: 3px; }
.stat-label { font-size: 9px; font-weight: 500; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
.action-btn { background: rgba(100,200,255,0.15); backdrop-filter: blur(15px); color: rgba(255,255,255,0.9); border: none; padding: 20px 50px; border-radius: 45px; font-size: 18px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 12px; transition: all 0.3s ease; align-self: center; flex-shrink: 0; border: 1px solid rgba(100,200,255,0.3); box-shadow: 0 6px 20px rgba(100,200,255,0.2); position: relative; }
.action-btn::before { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 45%; background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%); border-radius: 45px 45px 30px 30px; pointer-events: none; }
.action-btn:active { transform: translateY(2px) scale(0.97); }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.completion-screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); z-index: 20; padding: 40px; }
.completion-screen.visible { display: flex; animation: fadeIn 0.5s ease; }
.completion-title { font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.9); margin-bottom: 20px; text-align: center; }
.completion-stats { display: flex; gap: 25px; margin-bottom: 30px; }
.completion-stat { text-align: center; }
.completion-stat-value { font-size: 32px; font-weight: 700; color: rgba(100,200,255,0.9); margin-bottom: 6px; }
.completion-stat-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }
.completion-btn { background: rgba(100,200,255,0.15); color: rgba(255,255,255,0.9); border: none; padding: 18px 40px; border-radius: 40px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid rgba(100,200,255,0.3); box-shadow: 0 6px 20px rgba(100,200,255,0.2); }
.completion-btn:active { transform: scale(0.95); }

/* ШУЛЬТЕ */
.schulte-grid { position: absolute; inset: 0; display: grid; gap: 6px; padding: 15px; }
.schulte-cell { display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-weight: 700; color: rgba(255,255,255,0.95); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); transition: all 0.2s; position: relative; overflow: hidden; }
.schulte-cell::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent); pointer-events: none; }
.schulte-cell:active { transform: scale(0.95); }
.schulte-cell.correct { background: rgba(100,255,150,0.25); border-color: rgba(100,255,150,0.7); box-shadow: 0 0 15px rgba(100,255,150,0.4); color: rgba(100,255,150,0.95); }
.schulte-cell.wrong { animation: shake 0.4s ease; background: rgba(255,100,100,0.2); border-color: rgba(255,100,100,0.6); }
.schulte-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 56px; font-weight: 800; color: rgba(100,200,255,0.15); pointer-events: none; z-index: 2; }

/* КРАСНО-ЧЁРНАЯ */
.rc-grid { position: absolute; inset: 0; display: grid; gap: 6px; padding: 15px; }
.rc-cell { display: flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; font-weight: 700; transition: all 0.2s; position: relative; overflow: hidden; }
.rc-cell::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent); pointer-events: none; }
.rc-cell:active { transform: scale(0.95); }
.rc-cell.red { color: rgba(255,130,130,0.95); background: rgba(255,80,80,0.12); border: 1px solid rgba(255,100,100,0.35); }
.rc-cell.black { color: rgba(230,230,230,0.95); background: rgba(120,120,120,0.15); border: 1px solid rgba(160,160,160,0.3); }
.rc-cell.correct { background: rgba(100,255,150,0.25) !important; border-color: rgba(100,255,150,0.8) !important; box-shadow: 0 0 15px rgba(100,255,150,0.4); color: rgba(100,255,150,0.95) !important; }
.rc-cell.wrong { animation: shake 0.4s ease; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="catalog-slider" id="catalogSlider">
    <div class="catalog-slide"><button class="start-mechanic-btn" onclick="openTrainer(1)">Таблица Шульте</button></div>
    <div class="catalog-slide"><button class="start-mechanic-btn" onclick="openTrainer(2)">Красно-чёрная</button></div>
</div>
<div class="catalog-dots">
    <div class="catalog-dot active"></div>
    <div class="catalog-dot"></div>
</div>

<!-- ТРЕНАЖЁР 1: ШУЛЬТЕ -->
<div class="trainer-overlay" id="trainer1">
    <div class="trainer-header">
        <button class="icon-btn" onclick="closeTrainer()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <div class="session-info" id="timer1">00:00</div>
        <button class="icon-btn" onclick="toggleSound()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg></button>
    </div>
    <div class="trainer-content">
        <div class="game-zone" id="gameZone1"></div>
        <div class="stats-bar">
            <div class="stat-item"><div class="stat-value" id="schulteNext">1</div><div class="stat-label">След.</div></div>
            <div class="stat-item"><div class="stat-value" id="schulteTime">0с</div><div class="stat-label">Время</div></div>
            <div class="stat-item"><div class="stat-value" id="schulteErrors">0</div><div class="stat-label">Ошибок</div></div>
            <div class="stat-item"><div class="stat-value" id="schulteRound">5×5</div><div class="stat-label">Раунд 1</div></div>
        </div>
        <button class="action-btn" id="startBtn1" onclick="startSession1()">Начать тренировку</button>
    </div>
    <div class="completion-screen" id="completion1">
        <div class="completion-title">Таблица пройдена</div>
        <div class="completion-stats">
            <div class="completion-stat"><div class="completion-stat-value" id="compSchulteTime">0с</div><div class="completion-stat-label">Время</div></div>
            <div class="completion-stat"><div class="completion-stat-value" id="compSchulteErrors">0</div><div class="completion-stat-label">Ошибок</div></div>
            <div class="completion-stat"><div class="completion-stat-value" id="compSchulteSize">5×5</div><div class="completion-stat-label">Размер</div></div>
        </div>
        <button class="completion-btn" onclick="nextSchulteRound()">Следующий уровень</button>
    </div>
</div>

<!-- ТРЕНАЖЁР 2: КРАСНО-ЧЁРНАЯ -->
<div class="trainer-overlay" id="trainer2">
    <div class="trainer-header">
        <button class="icon-btn" onclick="closeTrainer()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <div class="session-info" id="timer2">00:00</div>
        <button class="icon-btn" onclick="toggleSound()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg></button>
    </div>
    <div class="trainer-content">
        <div class="game-zone" id="gameZone2"></div>
        <div class="stats-bar">
            <div class="stat-item"><div class="stat-value" id="rcNext">1</div><div class="stat-label">След.</div></div>
            <div class="stat-item"><div class="stat-value" id="rcMode">Красные</div><div class="stat-label">Режим</div></div>
            <div class="stat-item"><div class="stat-value" id="rcErrors">0</div><div class="stat-label">Ошибок</div></div>
            <div class="stat-item"><div class="stat-value" id="rcRound">5×5</div><div class="stat-label">Раунд 1</div></div>
        </div>
        <button class="action-btn" id="startBtn2" onclick="startSession2()">Начать тренировку</button>
    </div>
    <div class="completion-screen" id="completion2">
        <div class="completion-title">Раунд завершён</div>
        <div class="completion-stats">
            <div class="completion-stat"><div class="completion-stat-value" id="compRcTime">0с</div><div class="completion-stat-label">Время</div></div>
            <div class="completion-stat"><div class="completion-stat-value" id="compRcErrors">0</div><div class="completion-stat-label">Ошибок</div></div>
            <div class="completion-stat"><div class="completion-stat-value" id="compRcRoundNum">1</div><div class="completion-stat-label">Раунд</div></div>
        </div>
        <button class="completion-btn" onclick="nextRcRound()">Следующий раунд</button>
    </div>
</div>

<script>
let voiceEnabled = true;
let audioUnlocked = false;
let currentTrainer = null;

function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try { const AudioContext = window.AudioContext || window.webkitAudioContext; if (AudioContext) { const ctx = new AudioContext(); ctx.resume(); } } catch(e) {}
}
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true });

const catalogSlider = document.getElementById('catalogSlider');
const catalogDots = document.querySelectorAll('.catalog-dot');
catalogSlider.addEventListener('scroll', () => {
    const idx = Math.round(catalogSlider.scrollLeft / window.innerWidth);
    catalogDots.forEach((dot, i) => dot.classList.toggle('active', i === idx));
});

function toggleSound() { voiceEnabled = !voiceEnabled; }

function openTrainer(num) {
    unlockAudio();
    currentTrainer = num;
    document.getElementById('trainer' + num).classList.add('active');
}

function closeTrainer() {
    if (currentTrainer) document.getElementById('trainer' + currentTrainer).classList.remove('active');
    currentTrainer = null;
    stopAllSessions();
}

function stopAllSessions() {
    clearInterval(window._timer1); clearInterval(window._timer2);
    ['gameZone1','gameZone2'].forEach(id => document.getElementById(id).innerHTML = '');
    ['completion1','completion2'].forEach(id => document.getElementById(id).classList.remove('visible'));
    ['startBtn1','startBtn2'].forEach(id => {
        const btn = document.getElementById(id);
        btn.disabled = false;
        btn.textContent = 'Начать тренировку';
    });
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ===== ТРЕНАЖЁР 1: ТАБЛИЦА ШУЛЬТЕ =====
let s1 = { next: 1, total: 25, errors: 0, active: false, startTime: 0, gridSize: 5, round: 1 };

function startSession1() {
    s1.next = 1; s1.errors = 0; s1.active = true;
    s1.startTime = Date.now();
    document.getElementById('startBtn1').disabled = true;
    document.getElementById('startBtn1').textContent = 'Тренировка...';
    updateStats1();
    window._timer1 = setInterval(() => {
        const elapsed = Math.floor((Date.now() - s1.startTime) / 1000);
        document.getElementById('timer1').textContent = formatTime(elapsed);
        document.getElementById('schulteTime').textContent = elapsed + 'с';
    }, 1000);
    buildSchulteGrid1();
}

function buildSchulteGrid1() {
    const zone = document.getElementById('gameZone1');
    zone.innerHTML = '';
    const n = s1.gridSize;
    const total = n * n;
    s1.total = total;
    const numbers = shuffleArray(Array.from({length: total}, (_, i) => i + 1));
    
    const fontSize = n === 5 ? 24 : n === 6 ? 20 : n === 7 ? 17 : 14;
    
    const grid = document.createElement('div');
    grid.className = 'schulte-grid';
    grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    numbers.forEach(num => {
        const cell = document.createElement('div');
        cell.className = 'schulte-cell';
        cell.textContent = num;
        cell.dataset.value = num;
        cell.style.fontSize = fontSize + 'px';
        cell.onclick = () => clickSchulteCell1(cell);
        grid.appendChild(cell);
    });
    zone.appendChild(grid);
    
    const hint = document.createElement('div');
    hint.className = 'schulte-hint';
    hint.textContent = '1';
    hint.id = 'schulteHint';
    zone.appendChild(hint);
    
    document.getElementById('schulteRound').textContent = `${n}×${n}`;
    document.querySelector('#schulteRound').nextElementSibling.textContent = `Раунд ${s1.round}`;
}

function clickSchulteCell1(cell) {
    if (!s1.active || cell.classList.contains('correct')) return;
    const value = parseInt(cell.dataset.value);
    if (value === s1.next) {
        cell.classList.add('correct');
        s1.next++;
        const hint = document.getElementById('schulteHint');
        if (hint) hint.textContent = s1.next <= s1.total ? s1.next : '✓';
        if (s1.next > s1.total) {
            setTimeout(endSession1, 400);
        }
    } else {
        cell.classList.add('wrong');
        s1.errors++;
        setTimeout(() => cell.classList.remove('wrong'), 500);
    }
    updateStats1();
}

function updateStats1() {
    document.getElementById('schulteNext').textContent = s1.next <= s1.total ? s1.next : '✓';
    document.getElementById('schulteErrors').textContent = s1.errors;
}

function endSession1() {
    s1.active = false;
    clearInterval(window._timer1);
    const elapsed = Math.floor((Date.now() - s1.startTime) / 1000);
    document.getElementById('compSchulteTime').textContent = elapsed + 'с';
    document.getElementById('compSchulteErrors').textContent = s1.errors;
    document.getElementById('compSchulteSize').textContent = `${s1.gridSize}×${s1.gridSize}`;
    document.getElementById('completion1').classList.add('visible');
}

function nextSchulteRound() {
    document.getElementById('completion1').classList.remove('visible');
    document.getElementById('gameZone1').innerHTML = '';
    document.getElementById('timer1').textContent = '00:00';
    
    s1.gridSize++;
    if (s1.gridSize > 8) s1.gridSize = 5;
    s1.round++;
    
    const btn = document.getElementById('startBtn1');
    btn.disabled = false;
    btn.textContent = 'Начать тренировку';
    startSession1();
}

// ===== ТРЕНАЖЁР 2: КРАСНО-ЧЁРНАЯ =====
// Одна таблица на весь раунд. Сначала ищем красные 1..R, потом чёрные 1..B.
let s2 = { nextRed: 1, nextBlack: 1, redTotal: 0, blackTotal: 0, errors: 0, active: false, startTime: 0, mode: 'red', round: 1, gridSize: 5 };

function startSession2() {
    s2.nextRed = 1; s2.nextBlack = 1; s2.errors = 0; s2.active = true;
    s2.mode = 'red';
    s2.startTime = Date.now();
    document.getElementById('startBtn2').disabled = true;
    document.getElementById('startBtn2').textContent = 'Тренировка...';
    updateStats2();
    window._timer2 = setInterval(() => {
        const elapsed = Math.floor((Date.now() - s2.startTime) / 1000);
        document.getElementById('timer2').textContent = formatTime(elapsed);
    }, 1000);
    buildRcGrid2();
}

function buildRcGrid2() {
    const zone = document.getElementById('gameZone2');
    zone.innerHTML = '';
    const n = s2.gridSize;
    const total = n * n;
    
    const numbers = shuffleArray(Array.from({length: total}, (_, i) => i + 1));
    
    // Распределяем цвета: поровну
    const colors = [];
    const targetRed = Math.floor(total / 2);
    let redCount = 0, blackCount = 0;
    for (let i = 0; i < total; i++) {
        if (redCount < targetRed && (Math.random() < 0.5 || blackCount >= total - targetRed)) {
            colors.push('red'); redCount++;
        } else {
            colors.push('black'); blackCount++;
        }
    }
    s2.redTotal = redCount;
    s2.blackTotal = blackCount;
    s2.nextRed = 1;
    s2.nextBlack = 1;
    s2.mode = 'red';
    
    const fontSize = n === 5 ? 22 : n === 6 ? 18 : n === 7 ? 15 : 13;
    
    const grid = document.createElement('div');
    grid.className = 'rc-grid';
    grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    numbers.forEach((num, idx) => {
        const cell = document.createElement('div');
        cell.className = `rc-cell ${colors[idx]}`;
        cell.textContent = num;
        cell.dataset.value = num;
        cell.dataset.color = colors[idx];
        cell.style.fontSize = fontSize + 'px';
        cell.onclick = () => clickRcCell2(cell);
        grid.appendChild(cell);
    });
    zone.appendChild(grid);
    
    document.getElementById('rcRound').textContent = `${n}×${n}`;
    document.querySelector('#rcRound').nextElementSibling.textContent = `Раунд ${s2.round}`;
    updateStats2();
}

function clickRcCell2(cell) {
    if (!s2.active || cell.classList.contains('correct')) return;
    const value = parseInt(cell.dataset.value);
    const color = cell.dataset.color;
    let correct = false;
    
    if (s2.mode === 'red') {
        if (color === 'red' && value === s2.nextRed) {
            correct = true;
            s2.nextRed++;
            if (s2.nextRed > s2.redTotal) {
                s2.mode = 'black';
            }
        }
    } else {
        if (color === 'black' && value === s2.nextBlack) {
            correct = true;
            s2.nextBlack++;
            if (s2.nextBlack > s2.blackTotal) {
                setTimeout(endSession2, 400);
                return;
            }
        }
    }
    
    if (correct) {
        cell.classList.add('correct');
    } else {
        cell.classList.add('wrong');
        s2.errors++;
        setTimeout(() => cell.classList.remove('wrong'), 500);
    }
    updateStats2();
}

function updateStats2() {
    const next = s2.mode === 'red' ? s2.nextRed : s2.nextBlack;
    const total = s2.mode === 'red' ? s2.redTotal : s2.blackTotal;
    document.getElementById('rcNext').textContent = next <= total ? next : '✓';
    document.getElementById('rcMode').textContent = s2.mode === 'red' ? 'Красные' : 'Чёрные';
    document.getElementById('rcErrors').textContent = s2.errors;
}

function endSession2() {
    s2.active = false;
    clearInterval(window._timer2);
    const elapsed = Math.floor((Date.now() - s2.startTime) / 1000);
    document.getElementById('compRcTime').textContent = elapsed + 'с';
    document.getElementById('compRcErrors').textContent = s2.errors;
    document.getElementById('compRcRoundNum').textContent = s2.round;
    document.getElementById('completion2').classList.add('visible');
}

function nextRcRound() {
    document.getElementById('completion2').classList.remove('visible');
    document.getElementById('gameZone2').innerHTML = '';
    document.getElementById('timer2').textContent = '00:00';
    
    s2.gridSize++;
    if (s2.gridSize > 7) s2.gridSize = 5;
    s2.round++;
    
    const btn = document.getElementById('startBtn2');
    btn.disabled = false;
    btn.textContent = 'Начать тренировку';
    startSession2();
}
</script>

</body>
</html>
